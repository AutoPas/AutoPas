## Rayleigh Taylor instability in 3D
## From Worksheet 5

# ==== Container ====
container                        :  [LinkedCells]
verlet-rebuild-frequency         :  10
verlet-skin-radius               :  1.0
verlet-cluster-size              :  4
selector-strategy                :  Fastest-Absolute-Value
data-layout                      :  [AoS, SoA]
traversal                        :  [ lc_c01, lc_c08, lc_c18 ]
tuning-strategies                :  []
tuning-interval                  :  2500
tuning-samples                   :  3
tuning-max-evidence              :  10
functor                          :  Lennard-Jones
newton3                          :  [disabled, enabled]

# ==== Environment ====
box-min                          :  [0, 0, 0]
box-max                          :  [60, 60, 60]
cell-size                        :  [0.55]
cutoff                           :  3.6
slow_cutoff                      :  3.6
fast_cutoff                      :  1.5
slow_frequency                   :  100
deltaT                           :  0.0005
iterations                       :  50000
energy-sensor                    :  rapl
boundary-type                    :  [periodic,reflective,periodic]
globalForce                      :  [0, -12, 0]

# ==== Particles ====
Sites:
  0:
    mass:  1.0
    epsilon:  1.0
    sigma:  1.2
  1:
    mass: 5.0
    epsilon: 1.0
    sigma: 1.1

Objects:
  CubeGrid:
    0:
      bottomLeftCorner           : [0.6, 0.6, 0.6]
      particles-per-dimension    : [50, 10, 50]
      particle-spacing           : 1.2
      velocity                   : [0, 0, 0]
      particle-type-id           : 0
    1:
      bottomLeftCorner           : [0.6, 12.6, 0.6]
      particles-per-dimension    : [50, 10, 50]
      particle-spacing           : 1.2
      velocity                   : [0, 0, 0]
      particle-type-id           : 1

# ==== Thermostat ====
thermostat:
  initialTemperature             :  40
  targetTemperature              :  40
  deltaTemperature               :  1000
  thermostatInterval             :  1000
  addBrownianMotion              :  true

# ==== VTK ====
vtk-filename                     :  rayleigh-taylor-100
vtk-write-frequency              :  100
vtk-output-folder                :  vtkOutputFolder
no-end-config                    :  true
log-level                        :  info

# Example demonstrating (only) thread count tuning

container                        :  [LinkedCells]
traversal                        :  [lc_sliced]
newton3                          :  [enabled]
data-layout                      :  [SoA]

selector-strategy                :  Fastest-Absolute-Value
tuning-strategies                :  []
tuning-interval                  :  100
tuning-samples                   :  10
tuning-metric                    :  energy
energy-sensor                    :  rapl
functor                          :  Lennard-Jones (12-6)
cutoff                           :  2
deltaT                           :  0
thread-count                     : [1,2,4] # [0] or remove to disable thread count tuning
iterations                       :  1000
Sites:
  0:
    epsilon                      :  1.
    sigma                        :  1.
    mass                         :  1.
Objects:                         
  CubeGrid:
    0:  
      particles-per-dimension    :  [10, 10, 10]
      # Alternative, small scenario
      # (Should always yield ThreadCount = 1 in AutoPas_tuningResults_*.csv)
      #particles-per-dimension    :  [2, 2, 2]
      particle-spacing           :  0.5
      bottomLeftCorner           :  [0, 0, 0]
      velocity                   :  [0, 0, 0]
      particle-type-id           :  0
no-end-config                    :  true

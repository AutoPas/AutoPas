# VerletLists + vl_list_iteration + AoS + newton3 disabled
# Three isolated pairs at distance 0.9 (z-direction) in a box 20^3.
# Cell size ~= 2.857 -> z-cell [5.71, 8.57) contains both 6.2 and 7.1.
# Each pair sits in its own x,y-cell (different per pair -> no cross-pair interaction).
#
# Pair A : fluid-fluid                    (expected |F| = 138.66)
# Pair B : WALL first, then fluid         (expected |F| on fluid = 83.20;
#                                          suspected bug -> 0 in VL)
# Pair C : fluid first, then wall         (expected |F| on fluid = 83.20;
#                                          control case, always correct)

container                 : [VerletLists]
traversal                 : [vl_list_iteration]
data-layout               : [AoS]
newton3                   : [disabled]
functor                   : Lennard-Jones

cutoff                    : 2.5
verlet-rebuild-frequency  : 1
verlet-skin-radius        : 0.3
cell-size                 : [1]

box-min                   : [0, 0, 0]
box-max                   : [20, 20, 20]
boundary-type             : [reflective, reflective, reflective]
globalForce               : [0, 0, 0]

deltaT                    : 0.0005
iterations                : 1


tuning-strategies         : []
tuning-interval           : 100000
tuning-samples            : 1

zeta                      : 0.6

Sites:
  0:
    epsilon               : 1.0
    sigma                 : 1.0
    mass                  : 1.0
  1:
    epsilon               : 1.0
    sigma                 : 1.0
    mass                  : 1.0

Objects:
  CubeGrid:
    # --- Pair A : fluid-fluid (same cell; both type 0) ---
    0:
      particles-per-dimension : [1, 1, 1]
      particle-spacing        : 1.0
      bottomLeftCorner        : [3.5, 3.5, 6.2]
      velocity                : [0, 0, 0]
      particle-type-id        : 0
    1:
      particles-per-dimension : [1, 1, 1]
      particle-spacing        : 1.0
      bottomLeftCorner        : [3.5, 3.5, 7.1]
      velocity                : [0, 0, 0]
      particle-type-id        : 0

    # --- Pair B : WALL first (lower CubeGrid id -> lower SoA index), fluid second ---
    2:
      particles-per-dimension : [1, 1, 1]
      particle-spacing        : 1.0
      bottomLeftCorner        : [10.5, 10.5, 6.2]
      velocity                : [0, 0, 0]
      particle-type-id        : 1
    3:
      particles-per-dimension : [1, 1, 1]
      particle-spacing        : 1.0
      bottomLeftCorner        : [10.5, 10.5, 7.1]
      velocity                : [0, 0, 0]
      particle-type-id        : 0

    # --- Pair C : fluid first (control; unaffected by index-order bug) ---
    4:
      particles-per-dimension : [1, 1, 1]
      particle-spacing        : 1.0
      bottomLeftCorner        : [17.0, 17.0, 6.2]
      velocity                : [0, 0, 0]
      particle-type-id        : 0
    5:
      particles-per-dimension : [1, 1, 1]
      particle-spacing        : 1.0
      bottomLeftCorner        : [17.0, 17.0, 7.1]
      velocity                : [0, 0, 0]
      particle-type-id        : 1

vtk-filename              : test_pair_vl
vtk-output-folder         : test_pair_vl_out
vtk-write-frequency       : 1
log-level                 : info

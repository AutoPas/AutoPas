# LinkedCells + lc_c01 + AoS + newton3 disabled.
# Same 3-pair layout as test_pair_vl.yaml -- all pairs must come out correct here
# (no Verlet neighbor-list involved).

container                 : [LinkedCells]
traversal                 : [lc_c01]
data-layout               : [AoS]
newton3                   : [disabled]
functor                   : Lennard-Jones

cutoff                    : 2.5
verlet-rebuild-frequency  : 1
verlet-skin-radius        : 0.3
cell-size                 : [1]

box-min                   : [0, 0, 0]
box-max                   : [20, 20, 20]
boundary-type             : [reflective, reflective, reflective]
globalForce               : [0, 0, 0]

deltaT                    : 0.0005
iterations                : 1


tuning-strategies         : []
tuning-interval           : 100000
tuning-samples            : 1

zeta                      : 0.6

Sites:
  0:
    epsilon               : 1.0
    sigma                 : 1.0
    mass                  : 1.0
  1:
    epsilon               : 1.0
    sigma                 : 1.0
    mass                  : 1.0

Objects:
  CubeGrid:
    # Pair A : fluid-fluid
    0:
      particles-per-dimension : [1, 1, 1]
      particle-spacing        : 1.0
      bottomLeftCorner        : [3.5, 3.5, 6.2]
      velocity                : [0, 0, 0]
      particle-type-id        : 0
    1:
      particles-per-dimension : [1, 1, 1]
      particle-spacing        : 1.0
      bottomLeftCorner        : [3.5, 3.5, 7.1]
      velocity                : [0, 0, 0]
      particle-type-id        : 0

    # Pair B : wall first, fluid second
    2:
      particles-per-dimension : [1, 1, 1]
      particle-spacing        : 1.0
      bottomLeftCorner        : [10.5, 10.5, 6.2]
      velocity                : [0, 0, 0]
      particle-type-id        : 1
    3:
      particles-per-dimension : [1, 1, 1]
      particle-spacing        : 1.0
      bottomLeftCorner        : [10.5, 10.5, 7.1]
      velocity                : [0, 0, 0]
      particle-type-id        : 0

    # Pair C : fluid first, wall second
    4:
      particles-per-dimension : [1, 1, 1]
      particle-spacing        : 1.0
      bottomLeftCorner        : [17.0, 17.0, 6.2]
      velocity                : [0, 0, 0]
      particle-type-id        : 0
    5:
      particles-per-dimension : [1, 1, 1]
      particle-spacing        : 1.0
      bottomLeftCorner        : [17.0, 17.0, 7.1]
      velocity                : [0, 0, 0]
      particle-type-id        : 1

vtk-filename              : test_pair_lc
vtk-output-folder         : test_pair_lc_out
vtk-write-frequency       : 1
log-level                 : info
